{% extends "base.html" %}
{% block title %}{{ post.title }} — KAFUOSA{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 md:px-8 py-12 md:py-16">
  <!-- Back Navigation -->
  <div class="mb-8">
    <a href="{% url 'news:list' %}" class="inline-flex items-center gap-2 text-xs text-artAccent hover:text-artAccentL uppercase tracking-widest transition" style="font-family:'Josefin Sans',sans-serif;">
      <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to News
    </a>
  </div>

  <!-- Article Details Card -->
  <article class="art-card p-6 md:p-10">
    <div class="text-center mb-8 border-b pb-8" style="border-color: rgba(176,141,87,0.18);">
      <div class="deco-divider max-w-xs mx-auto mb-4">
        <span class="text-[10px] uppercase tracking-[0.3em] text-artAccent font-semibold" style="font-family:'Josefin Sans',sans-serif;">
          {{ post.get_category_display }}
        </span>
      </div>
      <h1 class="font-display font-bold text-3xl md:text-5xl text-white tracking-wide mt-3 mb-4 leading-tight">
        {{ post.title }}
      </h1>
      <div class="flex items-center justify-center gap-4 text-xs text-white/50" style="font-family:'Josefin Sans',sans-serif;">
        <span class="flex items-center gap-1.5">
          <i class="fa-regular fa-calendar-check text-artAccent text-[11px]"></i>
          {{ post.published_at|date:"d M Y" }}
        </span>
      </div>
    </div>

    {% if post.cover_image %}
      <div class="mb-8 deco-border rounded-sm overflow-hidden">
        <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="w-full h-80 md:h-[420px] object-cover" />
      </div>
    {% endif %}

    <div class="text-white/80 leading-relaxed text-sm md:text-base space-y-6" style="font-family:'Inter',sans-serif;">
      {{ post.body|safe }}
    </div>
  </article>
</div>
{% endblock %}
