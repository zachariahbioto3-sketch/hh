{% extends "base.html" %}
{% block title %}Events{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-20 text-center">
  <h1 class="text-2xl text-gray-500 mb-12">What's On. <span class="font-bold text-[#1e1e1e] border-b-2 border-[#8080B8] pb-1">Events Calendar</span></h1>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
    {% for e in events %}
    <a href="/events/{{ e.slug }}/" class="block bg-white border border-gray-200 p-6 group hover:border-[#1e1e1e] transition-colors">
      <p class="text-xs text-[#8080B8] font-bold uppercase tracking-widest">{{ e.start_datetime|date:"d M Y" }}</p>
      <h3 class="font-bold text-[#1e1e1e] text-xl mt-3 mb-2 group-hover:text-[#8080B8] transition-colors">{{ e.title }}</h3>
      <p class="text-sm text-gray-500"><svg xmlns="http://www.w3.org/2000/svg" class="inline w-4 h-4 mr-1" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> {{ e.venue }}</p>
    </a>
    {% empty %}
    <p class="text-gray-500 col-span-3 text-center py-8">No events yet.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
