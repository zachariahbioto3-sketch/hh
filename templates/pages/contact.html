{% extends "base.html" %}
{% block title %}Contact Us — KAFUOSA{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto px-4 py-20">

  <div class="text-center mb-12">
    <div class="deco-divider mb-5 max-w-xs mx-auto">
      <span class="text-[10px] uppercase tracking-[0.35em] text-artAccent font-semibold" style="font-family:'Josefin Sans',sans-serif;">Get In Touch</span>
    </div>
    <h1 class="font-display font-bold text-3xl text-white tracking-widest">Contact Us</h1>
  </div>

  <form method="post" class="art-card p-8 space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-white/60 text-[11px] uppercase tracking-widest mb-2" style="font-family:'Josefin Sans',sans-serif;">Your Name</label>
      <input name="name" placeholder="Full name"
             class="w-full px-4 py-3 text-sm text-white placeholder-white/25 focus:outline-none transition rounded-sm"
             style="background:#0D0A14; border:1px solid rgba(176,141,87,0.2); font-family:'Inter',sans-serif;">
    </div>
    <div>
      <label class="block text-white/60 text-[11px] uppercase tracking-widest mb-2" style="font-family:'Josefin Sans',sans-serif;">Email</label>
      <input name="email" type="email" placeholder="your@email.com"
             class="w-full px-4 py-3 text-sm text-white placeholder-white/25 focus:outline-none transition rounded-sm"
             style="background:#0D0A14; border:1px solid rgba(176,141,87,0.2); font-family:'Inter',sans-serif;">
    </div>
    <div>
      <label class="block text-white/60 text-[11px] uppercase tracking-widest mb-2" style="font-family:'Josefin Sans',sans-serif;">Subject</label>
      <input name="subject" placeholder="Subject"
             class="w-full px-4 py-3 text-sm text-white placeholder-white/25 focus:outline-none transition rounded-sm"
             style="background:#0D0A14; border:1px solid rgba(176,141,87,0.2); font-family:'Inter',sans-serif;">
    </div>
    <div>
      <label class="block text-white/60 text-[11px] uppercase tracking-widest mb-2" style="font-family:'Josefin Sans',sans-serif;">Message</label>
      <textarea name="message" rows="6" placeholder="Your message..."
                class="w-full px-4 py-3 text-sm text-white placeholder-white/25 focus:outline-none transition rounded-sm resize-none"
                style="background:#0D0A14; border:1px solid rgba(176,141,87,0.2); font-family:'Inter',sans-serif;"></textarea>
    </div>
    <button type="submit" class="btn-primary w-full py-3 rounded-sm text-sm font-semibold tracking-widest"
            style="font-family:'Josefin Sans',sans-serif;">
      Send Message
    </button>
  </form>

</div>

{% endblock %}
