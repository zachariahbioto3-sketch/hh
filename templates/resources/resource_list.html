{% extends "base.html" %}
{% block title %}Resources{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-20">
  <h1 class="text-2xl text-gray-500 mb-12 text-center">Document Library. <span class="font-bold text-[#1e1e1e] border-b-2 border-[#8080B8] pb-1">Resources</span></h1>
  <div class="space-y-4 max-w-4xl mx-auto">
    {% for r in resources %}
    <a href="/resources/{{ r.pk }}/" class="flex items-center justify-between border border-gray-200 bg-white p-6 hover:border-[#1e1e1e] transition-colors group">
      <div>
        <p class="font-bold text-[#1e1e1e] text-lg">{{ r.title }}</p>
        <p class="text-xs text-[#8080B8] uppercase font-bold tracking-wider mt-1">{{ r.get_category_display }}</p>
      </div>
      <span class="text-gray-400 group-hover:text-[#1e1e1e] transition-colors"><svg xmlns="http://www.w3.org/2000/svg" class="inline w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
    </a>
    {% empty %}
    <p class="text-gray-500 text-center py-8">No resources yet.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
