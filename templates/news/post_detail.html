{% extends "base.html" %}
{% block title %}{{ post.title }} — KAFUOSA{% endblock %}
{% block content %}

<div class="max-w-3xl mx-auto px-4 sm:px-6 py-20">

  {% if post.cover_image %}
  <div class="mb-10 overflow-hidden rounded-sm" style="border:1px solid rgba(176,141,87,0.15);">
    <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="w-full h-80 object-cover">
  </div>
  {% endif %}

  <div class="text-center mb-10 pb-10" style="border-bottom:1px solid rgba(176,141,87,0.15);">
    <span class="text-artAccent text-[10px] font-semibold uppercase tracking-[0.3em]" style="font-family:'Josefin Sans',sans-serif;">
      {{ post.get_category_display }}
    </span>
    <h1 class="font-display font-bold text-3xl sm:text-4xl text-white mt-4 mb-4 tracking-wider leading-tight">
      {{ post.title }}
    </h1>
    <p class="text-white/35 text-[10px] uppercase tracking-widest" style="font-family:'Josefin Sans',sans-serif;">
      {{ post.published_at|date:"d M Y" }}
    </p>
  </div>

  <div class="text-white/75 leading-relaxed text-sm space-y-4" style="font-family:'Inter',sans-serif;">
    {{ post.body|linebreaks }}
  </div>

  <div class="mt-16 pt-8" style="border-top:1px solid rgba(176,141,87,0.12);">
    <a href="{% url 'news:list' %}"
       class="inline-flex items-center gap-2 text-artAccent text-xs font-semibold uppercase tracking-widest hover:text-artAccentL transition"
       style="font-family:'Josefin Sans',sans-serif;">
      <i class="fa-solid fa-arrow-left text-[9px]"></i> Back to News
    </a>
  </div>

</div>

{% endblock %}
